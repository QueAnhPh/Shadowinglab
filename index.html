<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpeakBack</title>
<meta name="description" content="Luyện shadowing tiếng Anh, chấm phát âm từng từ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow column (max 680px), phone-first; sticky top bar; each sentence is a practice card. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14213d; --muted:#5b6678; --line:#dde2ea;
  --accent:#1f4e79; --head:#1f4e79; --amber:#f2b705; --amber-ink:#14213d;
  --ok:#17834f; --ok-bg:#dff3e8; --near:#b45f06; --near-bg:#fdebd3; --bad:#c62839; --bad-bg:#fbe1e4; --miss:#8a94a6;
  --hl-y:#ffec78; --hl-g:#96f0aa; --hl-b:#82dcf0; --sep:#c87828; --other:#eef1f6;
  --f-ui:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --surface:#172133; --ink:#e8edf5; --muted:#9aa6b8; --line:#2a3750;
  --accent:#7fb2e5; --head:#1b2c47; --amber:#f2b705; --amber-ink:#14213d;
  --ok:#4cd38c; --ok-bg:#16382a; --near:#f0a14a; --near-bg:#3d2a12; --bad:#ff6b7a; --bad-bg:#43181f; --miss:#6f7b8f;
  --hl-y:#6b5c10; --hl-g:#1f5a32; --hl-b:#16566a; --sep:#e0a060; --other:#1b2638; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#172133; --ink:#e8edf5; --muted:#9aa6b8; --line:#2a3750;
  --accent:#7fb2e5; --head:#1b2c47; --amber:#f2b705; --amber-ink:#14213d;
  --ok:#4cd38c; --ok-bg:#16382a; --near:#f0a14a; --near-bg:#3d2a12; --bad:#ff6b7a; --bad-bg:#43181f; --miss:#6f7b8f;
  --hl-y:#6b5c10; --hl-g:#1f5a32; --hl-b:#16566a; --sep:#e0a060; --other:#1b2638; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
header.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.01em;flex:1;min-width:0}
header.top h1 small{display:block;font-weight:400;font-size:12px;opacity:.8}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.4);padding:6px 12px;min-height:36px;font-size:13px}
button.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
button.rec{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button[disabled]{opacity:.5;cursor:default}
main{padding-block:20px 48px;display:grid;gap:16px}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--near-bg);color:var(--ink);border:1px solid var(--line)}
.notice b{color:var(--near)}
h2{font-size:20px;margin:8px 0 0;text-wrap:balance}
.muted{color:var(--muted);font-size:14px}
/* student picker */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{min-height:96px;font-size:22px;font-weight:600}
/* homework groups + deadline */
.hw{display:grid;gap:10px}
.hw-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-bottom:2px solid var(--line);padding-bottom:6px}
.hw-head h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.hw-head h3 .dl{font-weight:400;color:var(--muted)}
.hw-note{font-size:14px;color:var(--muted);margin:0}
.due{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.due.soon{background:var(--near-bg);color:var(--near)}
.due.over{background:var(--bad-bg);color:var(--bad)}
.deadline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;border-radius:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--amber)}
.deadline .t{min-width:0;flex:1 1 220px}
.deadline .t b{display:block;font-weight:600}
.deadline .t span{font-size:14px;color:var(--muted)}
.deadline .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;text-align:right}
.deadline .big small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.deadline.soon{border-left-color:var(--near)} .deadline.soon .big{color:var(--near)}
.deadline.over{border-left-color:var(--bad)} .deadline.over .big{color:var(--bad)}
.role{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--hl-y);color:var(--ink);margin-left:4px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;font-weight:600;font-size:16px;background:var(--surface);border:1px solid var(--line)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.tcard h3{margin:0;font-size:16px}
.tscroll{overflow-x:auto}
.ttable{border-collapse:collapse;width:100%;font-size:14px}
.ttable th,.ttable td{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.ttable th{font-size:12px;color:var(--muted);font-weight:600;border-top:none}
.ttable td:not(:first-child),.ttable th:not(:first-child){text-align:center;width:22%}
.tpct{display:inline-block;min-width:52px;text-align:center;border-radius:999px;padding:3px 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.tpct.ok{background:var(--ok-bg);color:var(--ok)} .tpct.mid{background:var(--near-bg);color:var(--near)} .tpct.zero{background:var(--line);color:var(--muted)} .tpct.late{background:var(--bad-bg);color:var(--bad)}
.tlist{display:grid;gap:8px;padding:0 12px 12px}
.trow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;border-top:1px solid var(--line);border-radius:0;background:none;box-shadow:none;padding:10px 4px;min-height:0;font-weight:400}
.trow:hover{background:var(--other)}
.chev{font-size:22px;color:var(--muted);font-weight:700}
.trow .t{flex:1;min-width:0;display:grid;gap:2px}
.trow .t span{font-size:13px;color:var(--muted)}
.trow .weak{color:var(--near)!important}
details.cmp{border-top:1px dashed var(--line);padding-top:10px}
details.cmp summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent)}
details.cmp .up{color:var(--ok)} details.cmp .down{color:var(--bad)}
.take{display:grid;gap:4px;margin-top:10px}
.take-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px}
.take-h span{color:var(--muted)}
.playtake{min-height:34px;padding:4px 12px;font-size:13.5px}
.sent.small{font-size:16px;line-height:1.7}
p.small{font-size:13px;margin:6px 0 0}
.cue{border:2px solid var(--line,#ccc);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--card2,rgba(127,127,127,.06))}
.cue p{margin:6px 0 2px}.cue ul{margin:0;padding-left:20px}
.strat,.notes{margin:8px 0;border:1px dashed var(--line,#ccc);border-radius:10px;padding:6px 10px}
.strat summary,.notes summary{cursor:pointer;font-weight:600}
.strat ol{padding-left:20px;margin:6px 0}
.demo{background:var(--card2,rgba(127,127,127,.06));border-radius:8px;padding:8px 10px;font-size:14px}
.notes label span{display:inline-block;min-width:7em;font-weight:600;font-size:13px;opacity:.8}
.demo .k{display:block;font-weight:600;font-size:12px;opacity:.75;margin-top:4px}
.notes label{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:6px 0}
.notes input{flex:1 1 220px;min-width:0;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line,#ccc);background:transparent;color:inherit}
.notes .prep{margin-top:6px}
.ginst{font-weight:700;margin:4px 0 8px}.ghead{text-align:center;margin:6px 0 10px}
.gform{border:1px solid var(--line,#ccc);border-radius:10px;padding:10px 12px;line-height:2.3}
.gsub{margin:10px 0 2px}.grow{margin:4px 0}
.gap{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;vertical-align:middle}
.gap .qn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--ink,#333);color:var(--bg,#fff);font-size:13px}
.gin{width:130px;font:inherit;padding:2px 6px;border:none;border-bottom:2px solid currentColor;background:transparent;color:inherit}
.gin.ok{border-color:var(--ok,#2e7d32);color:var(--ok,#2e7d32)}.gin.bad{border-color:var(--bad,#c62828);color:var(--bad,#c62828);text-decoration:line-through}
.gfix{color:var(--ok,#2e7d32);font-weight:700;font-size:14px}
.forms{display:inline-flex;gap:4px;line-height:1.2}
.fo{font-size:12px;padding:3px 8px;border-radius:999px}
.fo.on{outline:2px solid var(--accent,#7a4b2a);font-weight:700}
.fo.right{background:rgba(46,125,50,.15);font-weight:700}.fo.wrong{background:rgba(198,40,40,.15);text-decoration:line-through}
.gctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.gaudio{width:100%}
.gres{width:100%;border-collapse:collapse;font-size:14px}.gres td,.gres th{border-bottom:1px solid var(--line,#ddd);padding:4px 6px;text-align:left}
.gres .good{color:var(--ok,#2e7d32)}.gres .weak{color:var(--bad,#c62828)}
.ansb{background:rgba(255,213,79,.45);padding:0 2px;border-radius:3px}
.kwm{background:rgba(100,181,246,.35);color:inherit;padding:0 2px;border-radius:3px}
.gtr p{margin:6px 0;line-height:1.6}.gtr .sp{opacity:.75}
.lesson.locked{opacity:.55}
.today{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:10px;border-top:5px solid var(--accent,#e8a33d)}
.today h2{margin:0;font-size:19px}.today .done-msg{margin:0;font-size:16px}
.tbig{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--near-bg);border:2px solid var(--near);font-size:16px}
.tbig .cta{font-weight:700;color:var(--near)}
.tk{font-size:12px;font-weight:700;white-space:nowrap;opacity:.8}
.week{display:grid;gap:8px}.week h3,.owe h3{margin:4px 0 0;font-size:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:12px;background:var(--surface);font-size:12px;line-height:1.25;min-width:0}
.day b{font-size:13px}.day i{font-style:normal;font-size:15px}.day small{font-size:10px;min-height:12px}
.day.off{opacity:.35}.day.lock{opacity:.55}.day.ok{background:rgba(46,125,50,.12)}.day.now{outline:2px solid var(--near)}.day.late{background:rgba(198,40,40,.10)}
.owe{display:grid;gap:6px}
.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border-radius:14px}
.trow .t{flex:1;min-width:0}.trow .t b{display:block;font-weight:600;font-size:15px}.trow .t span{font-size:13px;color:var(--muted)}
.trow .go{font-size:20px;opacity:.5}.trow.over,.trow.late{border-left:4px solid var(--bad)}
.library{margin:6px 0;border-radius:14px;background:var(--surface);padding:8px 12px}
.library>summary{cursor:pointer;font-weight:700}
.library .tabs{margin:10px 0}
.donebox{margin:16px 0;border-radius:12px;background:rgba(127,127,127,.08);padding:8px 12px;filter:grayscale(1);opacity:.75}
.donebox>summary{cursor:pointer;font-weight:700}
.donegrp{margin:8px 0 4px}.donegrp>summary{cursor:pointer;font-weight:600}
.dnum{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink,#333);color:var(--bg,#fff);font-size:12px;margin:0 4px}
.logincard{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.logincard p{margin:0;font-size:14.5px}
details.nolog summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
details.nolog .pick{margin-top:8px}
/* homework alert, Speaking/Listening tabs, session folders */
.alert{display:grid;gap:8px;background:var(--near-bg);border:1px solid var(--line);border-left:5px solid var(--near);border-radius:14px;padding:14px}
.alert h2{margin:0 0 2px;font-size:17px}
.alert-row{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px 12px;background:var(--surface)}
.alert-row .t{flex:1;min-width:0}
.alert-row .t b{display:block;font-weight:600;font-size:15px}
.alert-row .t span{font-size:13px;color:var(--muted)}
.alert-row.over{border-color:var(--bad)}
.profile{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:0}
.profile>summary{padding:16px 18px;cursor:pointer;list-style:none;display:grid;gap:6px}
.profile>summary::-webkit-details-marker{display:none}
.profile>summary h2{margin:0;font-size:18px}
.profile .lvl{font-size:14px;color:var(--muted)}
.profile .focus{margin:0;padding-left:20px;font-size:15px}
.profile .focus li{margin:2px 0}
.profile .more{font-size:13px;color:var(--accent);font-weight:600}
.profile[open] .more{display:none}
.profile .pbody{padding:0 18px 16px;display:grid;gap:12px}
.profile .skill h3{margin:6px 0 4px;font-size:16px}
.crit{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.crit b{font-size:15px}
.crit .what{font-size:13px;color:var(--muted)}
.crit .pl{margin:0;padding-left:18px;font-size:14px}
.crit .pl li{margin:1px 0}
.crit .good{color:var(--ok)}
.crit .weak{color:var(--bad)}
.profile .note{font-size:13px;color:var(--muted)}
.subst{font-size:14px;color:var(--muted)}
.quota{font-size:13px;margin:4px 0 0}
.subst.wait{color:var(--near)}
.fb{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:14px;padding:10px 12px;display:grid;gap:6px;font-size:14px}
.fb h4{margin:0;font-size:15px}
.fb .said{font-style:italic;color:var(--muted)}
.fb ul{margin:0;padding-left:18px}
.fb .good{color:var(--ok)} .fb .weak{color:var(--bad)}
.fb .fix b{color:var(--ok)}
.autow{display:flex;flex-wrap:wrap;gap:6px}
.autow button{font-size:13px;padding:4px 10px;border-radius:999px}
.tsub{display:grid;gap:6px}
.tsub .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}

.allclear{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--ok-bg);color:var(--ok);font-weight:500}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.tab{border:none;background:transparent;font-weight:600;min-height:42px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;padding:0 6px;margin-left:4px}
.folder{display:grid;gap:10px}
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sess summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
details.sess summary::-webkit-details-marker{display:none}
details.sess summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.sess[open] summary::before{transform:rotate(90deg)}
.sname{font-weight:600;flex:1}
.smeta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
details.sess .lessons{padding:0 10px 10px}
.topic{display:grid;gap:8px}
.tname{margin:4px 2px 0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.lesson .chips{display:block;margin-top:4px}
/* lesson list */
.lessons{display:grid;gap:10px}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-weight:600}
.lesson .t span{font-size:13px;color:var(--muted)}
.ring{--p:0;width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-variant-numeric:tabular-nums}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
details.video{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.video summary{padding:12px 14px;cursor:pointer;font-weight:500}
details.video video{display:block;width:100%;max-width:100%;border-radius:0 0 12px 12px;background:#000}
/* sentence card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.card .n{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.card .best{font-variant-numeric:tabular-nums}
.card.other{background:var(--other);padding:12px 16px;gap:8px}
.card.other .sent{font-size:16px;line-height:1.7;color:var(--muted)}
.card.other .actions button{flex:0 0 auto;min-height:38px;padding:6px 14px;font-size:14px}
.who{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--sep);text-transform:none}
.card.mine .who{color:var(--accent)}
.sent{font-size:20px;line-height:1.9;word-break:normal;overflow-wrap:anywhere}
.chunk{border-radius:6px;cursor:pointer;padding:2px 0}
.chunk:hover{background:color-mix(in srgb,var(--amber) 18%,transparent)}
.chunk.playing{background:color-mix(in srgb,var(--amber) 35%,transparent)}
.w{display:inline;border-radius:5px;padding:1px 2px}
.w.hy{background:var(--hl-y)}.w.hg{background:var(--hl-g)}.w.hb{background:var(--hl-b)}
.sepm{color:var(--sep);font-weight:600;margin:0 2px}
.w.ok{color:var(--ok);text-decoration:underline 3px var(--ok);text-underline-offset:5px}
.w.near{color:var(--near);text-decoration:underline 3px dashed var(--near);text-underline-offset:5px}
.w.bad{color:var(--bad);text-decoration:underline 3px wavy var(--bad);text-underline-offset:5px}
.w.miss{color:var(--miss);text-decoration:line-through 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1 1 auto}
.live{font-size:15px;color:var(--muted);min-height:1.5em}
.card.free .q{font-weight:600}
.card.free .hint{margin:0;font-size:14px}
.card.free .hint b{font-weight:600}
.card.free .are{margin:0;font-size:13px;color:var(--muted)}
.result{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-size:28px;font-variant-numeric:tabular-nums}
.heard{font-size:14px;color:var(--muted)}

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";
env.allowLocalModels = false;
let asrP = null;
window.Whisper = {
  load(onProgress) {
    if (!asrP) asrP = pipeline("automatic-speech-recognition", "Xenova/whisper-tiny.en",
      { dtype: "q8", device: "wasm", progress_callback: p => onProgress && onProgress(p) })
      .catch(e => { asrP = null; throw e; });
    return asrP;
  },
  async transcribe(f32) { const asr = await this.load(); const out = await asr(f32); return (out && out.text || "").trim(); },
  /* longer free answers: bigger model, 30 s windows */
  _long: null,
  async transcribeLong(f32, onProgress) {
    if (!this._long) this._long = pipeline("automatic-speech-recognition", "Xenova/whisper-base.en",
      { dtype: "q8", device: "wasm", progress_callback: p => onProgress && onProgress(p) }).catch(e => { this._long = null; throw e; });
    const asr = await this._long;
    const out = await asr(f32, { chunk_length_s: 30, stride_length_s: 5 });
    return (out && out.text || "").trim();
  }
};
window.dispatchEvent(new Event("whisper-ready"));
</script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("shl:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("shl:" + k, JSON.stringify(v)); } catch {} }
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const inZalo = /Zalo/i.test(navigator.userAgent);
let DATA = null, student = store.get("student", null);
const player = $("#player");
let stopAt = null, playingEl = null;

/* ---------- homework + deadline ---------- */
const WD = ["Sun", "Mon", "Tues", "Wed", "Thurs", "Fri", "Sat"];
const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function parseDay(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtDeadline(iso) { const d = parseDay(iso); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}`; }
function daysLeft(iso) {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((parseDay(iso) - today) / 86400000);
}
function dueInfo(iso) {
  const n = daysLeft(iso);
  if (n > 1) return { cls: n <= 2 ? "soon" : "", chip: `Còn ${n} ngày`, big: String(n), sub: "ngày còn lại" };
  if (n === 1) return { cls: "soon", chip: "Còn 1 ngày", big: "1", sub: "ngày còn lại · hạn là ngày mai" };
  if (n === 0) return { cls: "soon", chip: "Hạn nộp hôm nay", big: "0", sub: "hôm nay là hạn nộp" };
  return { cls: "over", chip: `Quá hạn ${-n} ngày`, big: String(-n), sub: "ngày quá hạn" };
}
function hwTitle(H) { return `${H.title} – Deadline ${fmtDeadline(H.deadline)}`; }
function homeworkOf(L) { return (DATA.homework || []).find(H => H.lessons.includes(L.id)); }
function myRole(L) { return L.roles ? L.roles[student] || null : null; }
function isMine(L, s) { const r = myRole(L); return !r || !s.speaker || s.speaker === r; }
function deadlineBox(L) {
  const H = homeworkOf(L);
  if (!H) return "";
  const d = dueInfo(H.deadline);
  return `<div class="deadline ${d.cls}" role="status">
    <div class="t"><b>⏰ ${esc(hwTitle(H))}</b><span>${esc(H.note || "")}</span></div>
    <div class="big">${esc(d.big)}<small>${esc(d.sub)}</small></div></div>`;
}

/* ---------- text helpers ---------- */
const NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","12":"twelve"};
function normWord(w) {
  w = w.toLowerCase().replace(/[’`]/g, "'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
  return NUM[w] || w;
}
function speechWord(raw) { // remove stress marks but keep contractions
  return raw.replace(/([A-Za-z])'(?=(m|s|t|re|ll|ve|d)\b)/g, "$1\u0000").replace(/'/g, "").replace(/\u0000/g, "'");
}
/* parse a marked sentence into chunks of display words */
function parseSentence(text) {
  const chunks = [];
  const parts = text.split("/").map(s => s.trim()).filter(s => s.length);
  let hl = null;
  for (const part of parts) {
    const words = [];
    for (const tok of part.split(/(==|\+\+|!!|\*\*)/)) {
      if (tok === "==" || tok === "++" || tok === "!!") { const k = {"==":"y","++":"g","!!":"b"}[tok]; hl = hl === k ? null : k; continue; }
      if (tok === "**" || !tok) continue;
      for (const raw of tok.split(/\s+/).filter(Boolean)) {
        if (raw === "‿") { if (words.length) words[words.length - 1].link = true; continue; }
        if (/^[.,!?;:]+$/.test(raw) && words.length) { words[words.length - 1].raw += raw; continue; }

        const pieces = raw.replace(/\.{3}/g, "").split(/(?<=[A-Za-z])-(?=[A-Za-z])/);

/* ---------- alignment ---------- */
function lev(a, b) {

  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function sim(a, b) { return a === b ? 1 : 1 - lev(a, b) / Math.max(a.length, b.length, 1); }
/* expand recognizer output to words comparable with the expected keys */
/* numbers the recognizer (or the student) writes as digits, spelled out the way the sentence says them */
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function cardinal(n) {
  if (n < 20) return [ONES[n]];
  if (n < 100) return n % 10 ? [TENS[Math.floor(n / 10)], ONES[n % 10]] : [TENS[n / 10]];
  if (n < 1000) return [ONES[Math.floor(n / 100)], "hundred", ...(n % 100 ? cardinal(n % 100) : [])];
  return null;
}
let EXPECT = new Set();
function spellNumber(d) {
  const digits = [...d].map(c => ONES[+c]);
  const ohs = [...d].map(c => c === "0" ? "oh" : ONES[+c]);
  const card = d.length <= 3 && d[0] !== "0" ? cardinal(+d) : null;
  const score = ws => ws.filter(w => EXPECT.has(w)).length;
  return [card, ohs, digits].filter(Boolean).sort((a, b) => score(b) - score(a))[0];
}
function heardWords(transcript) {
  return transcript.replace(/(\d+):(\d\d)/g, "$1 $2").replace(/-/g, " ").replace(/\$/g, "").split(/\s+/)
    .flatMap(w => { const d = w.replace(/[^0-9]/g, ""); return d && d === w.replace(/[.,!?;:]/g, "") ? spellNumber(d) : [w]; })
    .map(normWord).filter(Boolean);

function align(exp, got) { // returns per-expected index: {heard|null}
  const m = exp.length, n = got.length, INF = 1e9;
  const D = Array.from({length: m + 1}, () => Array(n + 1).fill(INF)), B = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
  D[0][0] = 0;
  for (let i = 0; i <= m; i++) for (let j = 0; j <= n; j++) {
    if (i < m && D[i][j] + 1 < D[i+1][j]) { D[i+1][j] = D[i][j] + 1; B[i+1][j] = 1; }          // expected word missing
    if (j < n && D[i][j] + 1 < D[i][j+1]) { D[i][j+1] = D[i][j] + 1; B[i][j+1] = 2; }          // extra heard word

    else if (b === 1) { out[i-1] = null; i--; }
    else { j--; }
  }

}

/* ---------- pattern feedback (same patterns as the teacher's feedback) ---------- */
const VOWELS = /[aeiouy]/;
const FUNC = new Set(["a","an","the","of","to","in","on","at","and","my","i","it","is","are","for","with","so","but","from","about","as","that","there's","it's","i'm"]);
function diagnose(exp, heard) {
  if (!heard) return FUNC.has(exp) ? `Em bỏ sót từ nhỏ “${exp}”. Từ nhỏ vẫn đọc, chỉ đọc lướt nhẹ.` : `Em bỏ sót “${exp}”.`;
  if (exp.endsWith("ing") && !heard.endsWith("ing") && exp.startsWith(heard.slice(0, 3))) return "Thiếu đuôi -ing.";
  if (/(es|s)$/.test(exp) && (heard === exp.slice(0, -1) || heard === exp.slice(0, -2))) return "Thiếu âm cuối /s/ hoặc /z/ của đuôi -s/-es.";

  if (exp[0] === heard[0] && exp.slice(-1) === heard.slice(-1)) return `Nguyên âm chưa đúng: máy nghe thành “${heard}”.`;
  return `Máy nghe thành “${heard}”.`;
}

}
/* keep the higher score per sentence from this device and from the account, then save both */
function mergeBest(cloudBest) {
  const out = {};
  for (const L of DATA.lessons) {
    if (!L.for.includes(student)) continue;
    const key = `best:${student}:${L.id}`, local = store.get(key, {}), remote = (cloudBest || {})[L.id] || {};
    const m = { ...remote };
    for (const [i, v] of Object.entries(local)) if (m[i] == null || v > m[i]) m[i] = v;
    if (Object.keys(m).length) { store.set(key, m); if (JSON.stringify(m) !== JSON.stringify(remote)) out[L.id] = m; }
  }
  return out;
}

async function onCloud(user, profile) {

  if (user && profile && profile._error) {

  } else if (user && profile) {

    if (id && DATA.students.some(s => s.id === id)) {

/* lessons the teacher marked as finished (students[].done in lessons.json), e.g. done in class or sent another way */
function markedDone(sid, L) { const S = DATA.students.find(x => x.id === sid); return !!(S && (S.done || []).includes(L.id)); }
function lessonProgress(L) {
  if (markedDone(student, L)) return 100;
  const best = store.get(`best:${student}:${L.id}`, {});
  const mine = L.sentences.map((s, i) => [s, i]).filter(([s]) => isMine(L, s));
  const done = mine.filter(([, i]) => (best[i] || 0) >= 80).length;
  return mine.length ? Math.round(done / mine.length * 100) : 0;
}

function skillOf(L) {
  if (L.skill) return L.skill;
  const H = homeworkOf(L);
  if (H && H.skill) return H.skill;
  return L.type === "dictation" || L.type === "gap" ? "Listening" : "Speaking";
}
/* lessons of one session grouped by the topic of their text, in first-appearance order */
function topicsOf(ls) {
  const m = new Map();
  ls.forEach(L => { const t = L.topic || L.title; if (!m.has(t)) m.set(t, []); m.get(t).push(L); });
  return [...m];
}
/* daily homework: a lesson with "opens": "YYYY-MM-DD" stays locked until that day */
const VI_WD = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
function lockedUntil(L) { if (!L.opens || TEACH || daysLeft(L.opens) <= 0) return ""; const d = parseDay(L.opens); return `${VI_WD[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`; }
function lessonButton(L) {
  const lock = lockedUntil(L);
  if (lock) return `<button class="lesson locked" disabled><span class="ring" style="--p:0"><i>🔒</i></span><span class="t"><b>${esc(L.title)}</b><span>Mở vào ${esc(lock)}</span></span></button>`;
  const p = lessonProgress(L), r = myRole(L), H = homeworkOf(L);
  const n = L.sentences.filter(s => isMine(L, s)).length;
  const hwChip = H ? (() => { const d = dueInfo(H.deadline); return `<span class="due ${p >= 100 ? "" : d.cls}">${p >= 100 ? "✅ Đã xong" : "📝 Homework · " + esc(d.chip)}</span>`; })() : "";
  return `<button class="lesson" data-id="${L.id}"><span class="ring" style="--p:${p}"><i>${p}%</i></span>
    <span class="t"><b>${esc(L.title)}${r ? `<span class="role">Em nói phần ${esc(r)}</span>` : ""}</b><span>${L.type === "dictation" ? "Nghe chép" : L.type === "gap" ? "Nghe điền từ (IELTS)" : L.sentences.some(s => s.free) ? "Luyện nói + tự trả lời" : "Shadowing"} · ${n} câu</span>${hwChip ? `<span class="chips">${hwChip}</span>` : ""}</span></button>`;
}
/* homework still to do: not finished, deadline not passed more than 7 days ago */
function pendingHomework(mine) {
  const today = daysLeft;
  return (DATA.homework || []).map(H => {
    const ls = mine.filter(L => H.lessons.includes(L.id));
    const p = ls.length ? Math.round(ls.reduce((a, L) => a + lessonProgress(L), 0) / ls.length) : 0;
    return { H, ls, p, n: today(H.deadline) };
  }).filter(x => x.ls.length && x.p < 100 && x.n >= -7).sort((a, b) => a.n - b.n);
}
/* level card: IELTS criteria + this student's strengths / weaknesses / focus (data in lessons.json: criteria + students[].profile) */
function profileCard(sid, open) {
  const C = DATA.criteria, S = DATA.students.find(x => x.id === sid);
  if (!C || !S) return "";
  const P = S.profile || {};
  const skill = k => {
    const crit = (C[k] || []).map(c => {
      const m = ((P[k] || {}).by || {})[c.id] || {};
      const li = (arr, cls, icon) => (arr || []).map(t => `<li class="${cls}">${icon} ${esc(t)}</li>`).join("");
      const body = li(m.good, "good", "👍") + li(m.weak, "weak", "🔧");
      return `<div class="crit"><b>${esc(c.name)}</b><span class="what">${esc(c.what)}</span>${body ? `<ul class="pl">${body}</ul>` : ""}</div>`;
    }).join("");
    const note = (P[k] || {}).note;
    let auto = "";
    if (k === "speaking" && sid === student && !TEACH) {
      const R = wordReport(sid);
      if (R.weak.length || R.fixed.length) auto = `<div class="crit"><b>🤖 Máy nghe được từ bài em luyện</b><span class="what">Lấy từ lần nói gần nhất của từng câu. Bấm một từ để luyện lại đúng câu đó.</span>
        ${R.weak.length ? `<span class="weak">🔧 Còn đọc chưa đúng:</span><div class="autow">${R.weak.map(([w, x]) => `<button data-go="${esc(x.L)}">${esc(w)}</button>`).join("")}</div>` : ""}
        ${R.fixed.length ? `<span class="good">👍 Đã sửa được (lần đầu sai, giờ đúng): ${esc(R.fixed.join(", "))}</span>` : ""}</div>`;
    }
    return `<div class="skill"><h3>${k === "speaking" ? "🗣️ Speaking" : "🎧 Listening"}</h3>${note ? `<p class="note">${esc(note)}</p>` : ""}${crit}${auto}</div>`;
  };
  return `<details class="profile" ${open ? "open" : ""}>
    <summary><h2>📊 Em đang ở đâu</h2>
      ${P.level ? `<span class="lvl">${esc(P.level)}${P.updated ? ` · cập nhật ${esc(P.updated)}` : ""}</span>` : ""}
      <span class="more">${(P.focus || []).length ? "🎯 3 việc cần tập trung · " : ""}tiêu chí chấm, điểm mạnh, điểm cần sửa ›</span></summary>
    <div class="pbody">${(P.focus || []).length ? `<b>🎯 Tuần này tập trung:</b><ol class="focus">${P.focus.map(f => `<li>${esc(f)}</li>`).join("")}</ol>` : ""}${(C.intro || []).map(t => `<p class="note">${esc(t)}</p>`).join("")}${skill("speaking")}${skill("listening")}</div></details>`;
}
/* finished = marked by the teacher, every question of a listening test answered, or every sentence ≥ 80% / every free answer submitted */
function isDone(L) {
  if (markedDone(student, L)) return true;
  if (L.type === "gap") { const b = store.get(`best:${student}:${L.id}`, {}); return !!store.get(gapKey(L), {}).done || Object.keys(b).length >= L.sentences.length; }
  return lessonProgress(L) >= 100;
}
function doneBox(mine) {
  const by = sk => mine.filter(L => skillOf(L) === sk && isDone(L) && !lockedUntil(L));
  const sp = by("Speaking"), li = by("Listening");
  if (!sp.length && !li.length) return "";
  const grp = (icon, name, ls) => ls.length ? `<details class="donegrp"><summary>${icon} ${name} <span class="dnum">${ls.length}</span> accomplished</summary><div class="lessons">${ls.map(lessonButton).join("")}</div></details>` : "";
  return `<details class="donebox"><summary>✅ Đã làm <span class="muted">(bấm để xem lại, luyện thêm)</span></summary>${grp("🗣️", "Speaking", sp)}${grp("🎧", "Listening", li)}</details>`;
}
/* ---------- student home: Hôm nay → Tuần này → Còn phải làm → Kho bài → Đã làm ---------- */
function isoDay(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
const WD_SHORT = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
function kindOf(L) { return L.type === "gap" ? "🎧 Nghe" : L.type === "dictation" ? "🎧 Nghe chép" : "🗣️ Nói"; }
function todoRow(L, note, cls) {
  return `<button class="trow ${cls || ""}" data-id="${L.id}"><span class="tk">${kindOf(L)}</span><span class="t"><b>${esc(L.title)}</b>${note ? `<span>${note}</span>` : ""}</span><span class="go">›</span></button>`;
}
function viewList() {
  const mine = DATA.lessons.filter(L => L.for.includes(student));
  const now = new Date(), today = isoDay(now);
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const days = [...Array(7)].map((_, k) => { const d = new Date(mon); d.setDate(mon.getDate() + k); return d; });
  const week = mine.filter(L => L.opens && L.opens >= isoDay(days[0]) && L.opens <= isoDay(days[6]));
  const inWeek = new Set(week.map(L => L.id));
  const todayLs = week.filter(L => L.opens === today);
  const lateWeek = week.filter(L => L.opens < today && !isDone(L));
  const oldHw = pendingHomework(mine.filter(L => !inWeek.has(L.id) && !lockedUntil(L)));
  const oweIds = new Set([...lateWeek.map(L => L.id), ...oldHw.flatMap(x => x.ls.filter(L => !isDone(L)).map(L => L.id))]);
  // today card
  const todayHTML = (() => {
    const head = `<h2>📅 Hôm nay · ${VI_WD[now.getDay()]} ${now.getDate()}/${now.getMonth() + 1}</h2>`;
    if (todayLs.length) {
      const left = todayLs.filter(L => !isDone(L));
      return `<section class="today">${head}${left.length ? `<p class="muted">${left.length === todayLs.length ? "Bài của hôm nay:" : "Còn bài này nữa là xong hôm nay:"}</p>${left.map(L => `<button class="tbig" data-id="${L.id}"><span class="tk">${kindOf(L)}</span><b>${esc(L.title)}</b><span class="cta">Bắt đầu ›</span></button>`).join("")}`
        : `<p class="done-msg">🎉 Xong bài hôm nay rồi! ${lateWeek.length || oweIds.size ? "Còn vài bài cũ ở dưới nha." : "Nghỉ ngơi hoặc luyện thêm trong Kho bài."}</p>`}</section>`;
    }
    if (now.getDay() === 0) return `<section class="today">${head}<p class="done-msg">😴 Chủ nhật nghỉ. Thứ Hai có bài mới nha.</p></section>`;
    return `<section class="today">${head}<p class="done-msg">${oweIds.size ? "Hôm nay không có bài mới. Làm nốt bài còn nợ ở dưới nha." : "Hôm nay không có bài mới. 🎉"}</p></section>`;
  })();
  // week strip
  const weekHTML = week.length ? `<section class="week"><h3>Tuần này</h3><div class="days">${days.map(d => {
      const iso = isoDay(d), ls = week.filter(L => L.opens === iso);
      if (!ls.length) return `<div class="day off"><b>${WD_SHORT[d.getDay()]}</b><span>${d.getDate()}/${d.getMonth() + 1}</span><i>—</i></div>`;
      const done = ls.every(isDone), locked = iso > today, isToday = iso === today;
      const icon = done ? "✅" : locked ? "🔒" : isToday ? "▶️" : "⚠️";
      const first = ls.find(L => !isDone(L)) || ls[0];
      return `<button class="day ${done ? "ok" : locked ? "lock" : isToday ? "now" : "late"}" ${locked ? "disabled" : `data-id="${first.id}"`} title="${esc(ls.map(L => L.title).join(" · "))}"><b>${WD_SHORT[d.getDay()]}</b><span>${d.getDate()}/${d.getMonth() + 1}</span><i>${icon}</i><small>${ls.map(L => L.type === "gap" ? "🎧" : "🗣️").join("")}</small></button>`;
    }).join("")}</div><p class="muted small">✅ xong · ▶️ hôm nay · ⚠️ chưa làm · 🔒 chưa mở</p></section>` : "";
  // still owed
  const oweHTML = oweIds.size ? `<section class="owe"><h3>⏰ Còn phải làm</h3>
    ${lateWeek.map(L => todoRow(L, `Bài ${VI_WD[parseDay(L.opens).getDay()]} · tuần này`, "late")).join("")}
    ${oldHw.map(({ H, ls }) => ls.filter(L => !isDone(L)).map(L => { const d = dueInfo(H.deadline); return todoRow(L, `${esc(H.title)} · <span class="due ${d.cls}">${esc(d.chip)}</span>`, d.cls); }).join("")).join("")}
  </section>` : "";
  // library: everything else that is open and not done
  const lib = mine.filter(L => !inWeek.has(L.id) && !oweIds.has(L.id) && !lockedUntil(L) && !isDone(L));
  const tab = ["Speaking", "Listening"].includes(store.get("tab", "")) ? store.get("tab", "") : "Speaking";
  const folder = skill => {
    const ls = lib.filter(L => skillOf(L) === skill);
    const sessions = [...new Set(ls.map(L => L.session))].sort((a, b) => b - a);
    if (!sessions.length) return `<p class="muted">Không có bài ${skill} nào khác.</p>`;
    return sessions.map(n => {
      const inS = ls.filter(L => L.session === n);
      return `<div class="lessons"><p class="tname">📚 Buổi ${n}</p>${inS.map(lessonButton).join("")}</div>`;
    }).join("");
  };
  const libHTML = lib.length ? `<details class="library" ${store.get("libOpen", false) ? "open" : ""}><summary>📚 Kho bài <span class="muted">(luyện thêm, không bắt buộc · ${lib.length} bài)</span></summary>
    <div class="tabs" role="tablist">${["Speaking", "Listening"].map(t => `<button role="tab" class="tab${t === tab ? " on" : ""}" data-tab="${t}">${t === "Speaking" ? "🗣️" : "🎧"} ${t}</button>`).join("")}</div>
    <div class="folder">${folder(tab)}</div></details>` : "";
  const loginCard = cloudOn() && !cloudUser() ? `<section class="logincard"><img class="sticker" src="stickers/paw.svg" alt="">
      <p>🔐 <b>Đăng nhập Gmail để lưu tiến độ online.</b> Đổi máy không mất bài đã luyện; phần đã luyện trên máy này cũng được giữ lại.</p>
      <button class="gbtn" id="gSignIn">${GOOGLE_SVG}<span>Đăng nhập bằng Google</span></button>
      <p class="muted" id="gErr" hidden></p></section>` : "";
  $("#app").innerHTML = `${banner()}${cloudNote ? `<div class="notice"><b>Lưu ý.</b> ${esc(cloudNote)}</div>` : ""}${loginCard}
    ${todayHTML}${weekHTML}${oweHTML}
    ${profileCard(student, false)}
    ${libHTML}
    ${doneBox(mine)}
    <p class="foot"><img src="stickers/paw.svg" alt="">Chị chấm bài ngay trên web, em không cần gửi Zalo. Khi nào cần gửi Zalo chị sẽ nhắn em nha.</p>`;
  wireSignIn();
  $("#app").querySelectorAll("[data-id]").forEach(b => { if (!b.classList.contains("locked")) b.addEventListener("click", () => { location.hash = b.dataset.id; }); });
  $("#app").querySelectorAll(".autow button").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
  $("#app").querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { store.set("tab", b.dataset.tab); store.set("libOpen", true); viewList(); }));
  const li = $("#app").querySelector("details.library"); if (li) li.addEventListener("toggle", () => store.set("libOpen", li.open));
  startTour("list");
}

function renderSentenceHTML(chunks, statuses) {
  let k = 0;
  return chunks.map((ws, ci) => {
    const inner = ws.map(w => {
      const st = statuses ? statuses[k] : null; k++;
      const cls = ["w", w.hl && !st ? "h" + w.hl : "", st ? st.cls : ""].join(" ");
      return `<span class="${cls}">${esc(w.raw)}</span>${w.link ? ' <span class="sepm">‿</span>' : ""}${w.joinNext ? "" : " "}`;
    }).join("").trim();
    const sep = ci < chunks.length - 1 ? "/" : "//";
    return `<span class="chunk" data-c="${ci}">${inner}</span> <span class="sepm">${sep}</span>`;
  }).join(" ");
}

/* ---------- speaking strategy: guide + demo notes + note boxes (Part 1 A.R.E. · Part 2 cue card · Part 3 A.R.E.A.) ---------- */
function partOf(S) { const m = /part\s*([123])/i.exec(S.part || S.label || ""); return m ? +m[1] : 1; }
const STRAT = {
  1: { name: "Part 1 · A.R.E.", time: "3–4 câu · 20–30 giây",
    steps: ["<b>A – Answer:</b> trả lời thẳng câu hỏi trong 1 câu, dùng lại từ khóa của câu hỏi bằng từ khác (paraphrase).",
            "<b>R – Reason:</b> 1 câu giải thích vì sao (because / since / the main reason is…).",
            "<b>E – Example:</b> 1–2 câu ví dụ cụ thể của chính em (lúc nào, ở đâu, với ai). Có thể thêm 1 câu cảm nghĩ.",
            "Mỗi câu dùng ≥ 1 từ trong gợi ý. Ghi <b>từ khóa</b>, không viết cả bài: thi thật Part 1 không có giấy nháp."],
    fields: [["A", "Answer – trả lời thẳng"], ["R", "Reason – vì sao"], ["E", "Example – ví dụ của em"]],
    demo: { q: "Do you like getting up early?", notes: { A: "not a morning person · on weekdays have to", R: "school starts 7am · sleep late reviewing", E: "Saturday · sleep in till 9 · recharge" } } },
  2: { name: "Part 2 · Cue card", time: "1 phút chuẩn bị · nói 1'30–2'",
    steps: ["<b>1 phút chuẩn bị:</b> gạch từ khóa trên cue card, ghi 2–4 từ khóa cho mỗi gợi ý. Thi thật được giữ giấy ghi chú khi nói.",
            "<b>Mở bài (1 câu):</b> I'm going to talk about… / I'd like to describe…",
            "<b>Thân bài:</b> đi lần lượt từng gợi ý trên card; đề trải nghiệm thì kể theo <b>STAR</b> (Situation → Task → Action → Result).",
            "<b>Kết (dòng 'and explain…'):</b> 2–3 câu cảm nghĩ, bài học. Đây là chỗ ăn điểm, đừng bỏ.",
            "Nói đủ 1'30–2'. Hết ý thì thêm chi tiết: ai, ở đâu, cảm giác thế nào."],
    demo: { q: "Describe a teacher who has influenced you.", notes: { open: "my 10th-grade chemistry teacher", "Who the teacher was": "Ms. Lan · strict but caring", "What he/she taught you": "chemistry · lab skills · ask why", "How he/she taught": "real-life examples · small groups", explain: "fell in love with science · now aim for a medical major" } } },
  3: { name: "Part 3 · A.R.E.A.", time: "4–6 câu · 30–45 giây",
    steps: ["<b>A – Answer:</b> nêu quan điểm rõ ràng (I'd say… / It depends on…).",
            "<b>R – Reason:</b> lý do chung cho cả xã hội, không chỉ bản thân em (mostly because… / this is largely due to…).",
            "<b>E – Example:</b> ví dụ ở Việt Nam, ở trường, trên báo, hoặc so sánh xưa – nay.",
            "<b>A – Alternative / Answer again:</b> nhìn mặt kia (On the other hand…) rồi chốt lại ý của em (So overall…).",
            "Ghi từ khóa; thi thật Part 3 không có giấy nháp."],
    fields: [["A1", "Answer – quan điểm"], ["R", "Reason – lý do chung"], ["E", "Example – ví dụ"], ["A2", "Alternative – mặt kia + chốt ý"]],
    demo: { q: "Is it better to study at home or at a library?", notes: { A1: "depends on the person · mostly library", R: "fewer distractions · quiet · focus longer", E: "my friends · phone at home · library 3 hours straight", A2: "home saves travel time · but overall library" } } },
};
function noteFields(S) {
  const p = partOf(S);
  if (p !== 2) return STRAT[p].fields;
  return [["open", "Mở bài – em sẽ nói về gì"], ...(S.cue || []).map(c => [c, c]), ["explain", S.explain ? "Kết – " + S.explain : "Kết – cảm nghĩ, vì sao"]];
}
function cueHTML(S) {
  return `<div class="cue"><b>${esc(S.q)}</b>${(S.cue || []).length ? `<p>You should say:</p><ul>${S.cue.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}${S.explain ? `<p>and ${esc(S.explain)}.</p>` : ""}</div>`;
}
function stratHTML(L, S) {
  const p = partOf(S), G = STRAT[p], D = S.demo || G.demo;
  const dFields = p === 2 ? [["open", "Mở bài"], ...Object.keys(D.notes).filter(k => k !== "open" && k !== "explain").map(k => [k, k]), ["explain", "Kết"]] : G.fields;
  return `<details class="strat"><summary>📘 Cách trả lời ${esc(G.name)} · ${esc(G.time)}</summary>
    <ol>${G.steps.map(t => `<li>${t}</li>`).join("")}</ol>
    <p class="muted">Làm mẫu cách ghi chú (câu khác, chỉ là từ khóa, không phải bài mẫu):</p>
    <div class="demo"><b>❓ ${esc(D.q)}</b>${dFields.map(([k, lab]) => D.notes[k] ? `<div><span class="k">${esc(lab)}</span> ${esc(D.notes[k])}</div>` : "").join("")}</div>
    <p class="muted">Đến lượt em: ghi từ khóa vào ô bên dưới, tập nói bằng 🎙 Ghi âm thử cho đến khi trôi chảy.</p></details>`;
}
const notesKey = L => `notes:${student}:${L.id}`;
function notesHTML(L, S, i) {
  const n = (store.get(notesKey(L), {})[i]) || {}, p = partOf(S);
  return `<details class="notes" open><summary>📝 Ghi chú của em ${p === 2 ? "(như giấy nháp khi thi)" : "(từ khóa hoặc câu ngắn)"}</summary>
    ${noteFields(S).map(([k, lab]) => `<label><span>${esc(lab)}</span><input data-k="${esc(k)}" value="${esc(n[k] || "")}" placeholder="từ khóa / câu ngắn…" autocomplete="off"></label>`).join("")}

}
let noteTimer = null;
function wireNotes(L, i, card) {
  card.querySelectorAll(".notes input").forEach(inp => inp.addEventListener("input", () => {
    const all = store.get(notesKey(L), {}), n = all[i] || {};
    n[inp.dataset.k] = inp.value.slice(0, 200); all[i] = n; store.set(notesKey(L), all);
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { if (cloudUser()) window.Cloud.saveTake(`${L.id}~${i}~note`, { lesson: L.id, i, kind: "note", at: Date.now(), s: 0, st: "", h: "", audio: "", notes: n }).catch(e => console.error(e)); }, 1500);
  }));
  const prep = card.querySelector(".prep");
  if (prep) prep.addEventListener("click", () => {
    if (prep._t) { clearInterval(prep._t); prep._t = null; prep.textContent = "⏱ Bắt đầu 1 phút chuẩn bị"; return; }
    let left = 60; const live = card.querySelector(".live");
    prep.textContent = "⏱ 60 giây · bấm để dừng";
    prep._t = setInterval(() => {
      left--; prep.textContent = `⏱ ${left} giây · bấm để dừng`;
      if (left <= 0) { clearInterval(prep._t); prep._t = null; prep.textContent = "⏱ Bắt đầu 1 phút chuẩn bị"; live.textContent = "Hết 1 phút! Bắt đầu nói ngay (🎙 Ghi âm thử hoặc 📤 Ghi âm nộp bài), nói 1'30–2'."; }
    }, 1000);
  });
}
function notesText(L, S, i) {
  const n = (store.get(notesKey(L), {})[i]) || {};
  return noteFields(S).map(([k, lab]) => n[k] ? `${lab}: ${n[k]}` : "").filter(Boolean).join(" | ").slice(0, 900);
}

function viewLesson(L) {

/* ---------- Listening: nghe điền từ kiểu IELTS (type "gap") ----------
   Lesson: { type:"gap", audio, part, prep (giây đọc đề), instructions, heading, strategy[],
     rows:[ "text với {n} là ô trống", "## tiêu đề nhỏ" ],
     qs:{ n:{ ans:[...đáp án chấp nhận], form:[đúng, sai] (2 dạng từ, thứ tự hiển thị trộn theo n), kw:"từ khóa câu hỏi" } },
     transcript:[ { sp:"Woman", t:"…**khúc đáp án**… [[paraphrase của từ khóa]] …" } ] }
   Mỗi câu = 1 "sentence" ảo để tiến độ / màn giáo viên dùng chung (best[i] = 100 nếu đúng). */
function prepGap(d) {
  for (const L of d.lessons) if (L.type === "gap") L.sentences = Object.keys(L.qs).map(n => ({ gap: true, n }));
}
const gapKey = L => `gap:${student}:${L.id}`;
const normAns = t => String(t || "").toLowerCase().replace(/[’']/g, "'").replace(/[.,;:!?"]/g, "").replace(/\s+/g, " ").trim();
function gapOk(q, v) { const x = normAns(v); return !!x && q.ans.some(a => normAns(a) === x); }
function formOpts(q, n) { return (+n) % 2 ? [q.form[0], q.form[1]] : [q.form[1], q.form[0]]; }
function hlTranscript(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b class=\"ansb\">$1</b>").replace(/\[\[(.+?)\]\]/g, "<mark class=\"kwm\">$1</mark>");
}
function gapRowsHTML(L, st, done) {
  return L.rows.map(r => {
    if (r.startsWith("## ")) return `<h4 class="gsub">${esc(r.slice(3))}</h4>`;
    const html = esc(r).replace(/\[\[(.+?)\]\]/g, "<mark class=\"kwm\">$1</mark>").replace(/\{(\d+)\}/g, (m, n) => {
      const q = L.qs[n]; if (!q) return m;
      const v = (st.a || {})[n] || "", f = (st.f || {})[n];
      const ok = done ? gapOk(q, v) : null;
      const opts = formOpts(q, n);
      return `<span class="gap"><b class="qn">${n}</b><input class="gin ${done ? (ok ? "ok" : "bad") : ""}" data-n="${n}" value="${esc(v)}" ${done ? "disabled" : ""} autocomplete="off" autocapitalize="off" spellcheck="false">${done && !ok ? `<span class="gfix">✔ ${esc(q.ans[0])}</span>` : ""}
        <span class="forms" data-n="${n}">${opts.map(o => `<button class="fo ${f === o ? "on" : ""} ${done ? (o === q.form[0] ? "right" : f === o ? "wrong" : "") : ""}" data-v="${esc(o)}" ${done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</span></span>`;
    });
    return `<div class="grow">${html}</div>`;
  }).join("");
}
function viewGap(L) {
  const st = store.get(gapKey(L), {}), done = !!st.done;
  const nq = Object.keys(L.qs).length;
  $("#app").innerHTML = `${banner()}
    <button class="back" id="backBtn">← Danh sách bài</button>
    <h2>${esc(L.title)}</h2>
    <p class="muted">${esc(L.subtitle || "")}</p>
    ${deadlineBox(L)}
    ${(L.strategy || []).length ? `<details class="strat" ${done ? "" : "open"}><summary>📘 Cách làm dạng bài này</summary><ol>${L.strategy.map(t => `<li>${t}</li>`).join("")}</ol></details>` : ""}
    <section class="card gapcard">
      <div class="n"><span>${esc(L.part || "Listening")} · ${nq} câu</span><span class="best">${done ? `Điểm: ${st.score}/${nq}` : ""}</span></div>
      <p class="ginst">${esc(L.instructions || "Write ONE WORD AND/OR A NUMBER for each answer.")}</p>
      ${L.heading ? `<h3 class="ghead">${esc(L.heading)}</h3>` : ""}
      <div class="gform">${gapRowsHTML(L, st, done)}</div>
      <p class="muted small">Dưới mỗi ô: chọn <b>dạng từ</b> cần điền (làm trong lúc đọc đề, trước khi nghe).</p>
      <div class="gctl">
        ${done ? `<audio src="${esc(L.audio)}" controls preload="metadata" class="gaudio"></audio>
          <button id="gRedo">🔁 Làm lại từ đầu</button>`
        : `<button class="primary" id="gStart">▶ Bắt đầu: ${L.prep || 30} giây đọc đề</button>
          <button class="primary" id="gSubmit" hidden>📤 Nộp bài</button>`}
      </div>
      <div class="live" aria-live="polite"></div>
    </section>
    ${done ? gapResultHTML(L, st) : ""}`;
  $("#backBtn").addEventListener("click", () => { location.hash = ""; });
  const save = () => store.set(gapKey(L), st);
  if (!done) {
    $("#app").querySelectorAll(".gin").forEach(inp => inp.addEventListener("input", () => { (st.a = st.a || {})[inp.dataset.n] = inp.value; save(); }));
    $("#app").querySelectorAll(".forms .fo").forEach(b => b.addEventListener("click", () => {
      const n = b.parentElement.dataset.n; (st.f = st.f || {})[n] = b.dataset.v; save();
      b.parentElement.querySelectorAll(".fo").forEach(x => x.classList.toggle("on", x === b));
    }));
    const live = $("#app").querySelector(".live"), start = $("#gStart"), sub = $("#gSubmit");
    const audio = new Audio(L.audio);
    start.addEventListener("click", () => {
      start.disabled = true; sub.hidden = false;
      let left = L.prep || 30;
      const tick = () => { start.textContent = `📖 Đọc đề · còn ${left} giây (bấm để nghe luôn)`; };
      tick(); start.disabled = false;
      const t = setInterval(() => { left--; tick(); if (left <= 0) go(); }, 1000);
      const go = () => {
        clearInterval(t); start.disabled = true; start.textContent = "🎧 Đang phát (chỉ nghe 1 lần như thi thật)…";
        audio.play().catch(() => { live.textContent = "Máy chưa phát được audio. Bấm lại nha."; start.disabled = false; });
      };
      start.onclick = go;
      audio.onended = () => { start.textContent = "✅ Hết audio. Kiểm tra chính tả, số ít/số nhiều rồi bấm Nộp bài."; live.textContent = ""; };
    }, { once: true });
    sub.addEventListener("click", () => {
      const miss = Object.keys(L.qs).filter(n => !(st.f || {})[n]).length;
      if (miss && !confirm(`Còn ${miss} câu chưa chọn dạng từ. Vẫn nộp?`)) return;
      try { audio.pause(); } catch {}
      gradeGap(L, st); save(); viewGap(L); window.scrollTo(0, 0);
    });
  } else {
    $("#gRedo").addEventListener("click", () => { store.set(gapKey(L), { a: {}, f: {} }); viewGap(L); });
  }
}
function gradeGap(L, st) {
  const best = store.get(`best:${student}:${L.id}`, {});
  let score = 0, formsOk = 0;
  Object.keys(L.qs).forEach((n, i) => {
    const q = L.qs[n], ok = gapOk(q, (st.a || {})[n]);
    if (ok) score++;
    if ((st.f || {})[n] === q.form[0]) formsOk++;
    best[i] = Math.max(best[i] || 0, ok ? 100 : 0);
  });
  st.done = true; st.score = score; st.formsOk = formsOk; st.at = Date.now();
  st.tries = (st.tries || 0) + 1; if (st.tries === 1) st.first = score;
  store.set(`best:${student}:${L.id}`, best); syncBest(L.id, best);
  if (cloudUser()) window.Cloud.saveTake(`${L.id}~0~gap`, { lesson: L.id, i: 0, kind: "gap", at: st.at, s: score, st: "", h: "", audio: "", a: st.a || {}, f: st.f || {}, first: st.first, tries: st.tries }).catch(e => console.error(e));
}
function gapResultHTML(L, st) {
  const nq = Object.keys(L.qs).length;
  const rows = Object.keys(L.qs).map(n => {
    const q = L.qs[n], v = (st.a || {})[n] || "", ok = gapOk(q, v), fk = (st.f || {})[n] === q.form[0];
    return `<tr><td>${n}</td><td class="${ok ? "good" : "weak"}">${ok ? "✔" : "✘"} ${esc(v || "—")}</td><td><b>${esc(q.ans.join(" / "))}</b></td><td class="${fk ? "good" : "weak"}">${fk ? "✔ " + esc(q.form[0]) : `✘ ${(st.f || {})[n] ? "em chọn " + esc(st.f[n]) : "chưa chọn"} → <b>${esc(q.form[0])}</b>`}</td></tr>`;

function grade(L, i, card, chunks, exp, top, alts, clipP) {
  EXPECT = new Set(exp);
  const got = heardWords(top);
  const map = align(exp, got);
  const altWords = new Set(alts.flat().flatMap(heardWords));
  const statuses = exp.map((e, k) => {
    const h = map[k];
    if (h === e) return { cls: "ok" };
    if (altWords.has(e) && (h == null || sim(e, h) >= 0.5)) return { cls: "near", heard: h };
    if (h == null) return { cls: "miss" };
    return { cls: "bad", heard: h };
  });
  const score = Math.round(statuses.reduce((s, x) => s + (x.cls === "ok" ? 1 : x.cls === "near" ? 0.5 : 0), 0) / exp.length * 100);
  const key = `best:${student}:${L.id}`, best = store.get(key, {});
  if (best[i] == null || score > best[i]) { best[i] = score; store.set(key, best); syncBest(L.id, best); card.querySelector(".best").textContent = "Tốt nhất: " + score + "%"; }
  card.querySelector(".sent").innerHTML = renderSentenceHTML(chunks, statuses);
  recordTake(L, i, card, score, top, statuses, clipP);
  card.querySelectorAll(".chunk").forEach(ch => ch.addEventListener("click", () => {
    const span = L.sentences[i].chunks[+ch.dataset.c]; if (span) playSpan(span[0], span[1], ch);
  }));
  const raws = chunks.flat();
  const seen = new Set();
  const fixes = statuses.map((st, k) => ({ st, w: exp[k], raw: raws[k].raw })).filter(x => x.st.cls !== "ok" && !seen.has(x.w) && seen.add(x.w));
  const res = card.querySelector(".result");
  res.hidden = false;
  const verdict = score >= 90 ? "Giỏi quá! Qua câu tiếp theo được rồi." : score >= 80 ? "Đạt rồi! Sửa nốt mấy từ dưới là xịn." : score >= 50 ? "Gần được rồi. Sửa các từ dưới rồi nói lại nha." : "Từ từ thôi. Bấm Nghe mẫu, rồi nói lại chậm và rõ nha.";
  res.innerHTML = `
    <div class="cheer"><img src="stickers/${score >= 90 ? "wave" : score >= 80 ? "wink" : score >= 50 ? "cup-cat" : "sleep"}.svg" alt="">
      <div class="score"><b style="color:${score >= 80 ? "var(--ok)" : score >= 50 ? "var(--near)" : "var(--bad)"}">${score}%</b><span>${score >= 90 ? "🎉 " : score >= 80 ? "👍 " : score >= 50 ? "☕ " : "💪 "}${verdict}</span></div></div>
    <div class="heard">Máy nghe được: “${esc(top)}”</div>
    ${fixes.length ? `<ul class="fixes">${fixes.map(f => {
      const ipa = DATA.ipa[f.w], tip = DATA.tips[f.w];
      const kind = f.st.cls === "near" ? "Máy nghe chưa rõ, đọc rõ hơn." : diagnose(f.w, f.st.heard);
      return `<li class="k-${f.st.cls}"><span class="word">${esc(speechWord(f.raw).replace(/[.,!?;:]+$/, ""))}${ipa ? ` <span class="ipa">/${esc(ipa)}/</span>` : ""}</span>
        <span>${esc(kind)}</span>${tip ? `<span class="tip">${esc(tip)}</span>` : ""}</li>`;
    }).join("")}</ul>` : `<p class="okmsg">Đọc đủ và đúng hết các từ.</p>`}`;
}

/* ---------- teacher view: every student's progress ---------- */
function progressOf(L, sid, best) {
  const role = L.roles ? L.roles[sid] : null;
  const idx = L.sentences.map((s, i) => (!role || !s.speaker || s.speaker === role) ? i : -1).filter(i => i >= 0);
  const done = idx.filter(i => (best[i] || 0) >= 80);
  const tried = idx.filter(i => best[i] != null);
  const weak = idx.filter(i => best[i] != null && best[i] < 80);
  if (markedDone(sid, L)) return { idx, done: idx, tried: idx, weak: [], pct: 100, marked: true };
  return { idx, done, tried, weak, pct: idx.length ? Math.round(done.length / idx.length * 100) : 0 };
}
function ago(d) {
  if (!d) return "chưa luyện";
  const m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 60) return m <= 1 ? "vừa xong" : `${m} phút trước`;
  const h = Math.round(m / 60); if (h < 24) return `${h} giờ trước`;
  const days = Math.round(h / 24); return `${days} ngày trước`;
}

/* teacher: every submitted free answer; download the ungraded ones as one JSON file for grading */

  });
}

function showTourStep() {
  const T = tourState;
  while (T.k < T.steps.length && !document.querySelector(T.steps[T.k].sel)) T.k++;
  if (T.k >= T.steps.length) return endTour();
  const step = T.steps[T.k];
  T.el = document.querySelector(step.sel);
  const n = T.steps.filter(x => document.querySelector(x.sel)).length;
  const i = T.steps.slice(0, T.k + 1).filter(x => document.querySelector(x.sel)).length;
  const last = !T.steps.slice(T.k + 1).some(x => document.querySelector(x.sel));
  document.querySelectorAll(".tour-spot,.tour-pop").forEach(e => e.remove());
  const spot = document.createElement("div"); spot.className = "tour-spot";
  const pop = document.createElement("div"); pop.className = "tour-pop"; pop.setAttribute("role", "dialog");
  pop.innerHTML = `<p>${step.text}</p><div class="tour-nav"><span>${i}/${n}</span><button class="linkbtn" data-a="skip">Bỏ qua</button><button class="primary" data-a="next">${last ? "Xong 👍" : "Tiếp"}</button></div>`;
  document.body.append(spot, pop);
  pop.querySelector('[data-a="skip"]').addEventListener("click", endTour);
  pop.querySelector('[data-a="next"]').addEventListener("click", () => { if (last) endTour(); else { T.k++; showTourStep(); } });
  spot.addEventListener("click", endTour);
  T.el.scrollIntoView({ block: "center", behavior: "instant" in document.documentElement.style ? "instant" : "auto" });
  requestAnimationFrame(() => { placeTour(); pop.querySelector('[data-a="next"]').focus({ preventScroll: true }); });
}
function startTour(name, force) {
  if (!TOURS[name] || (!force && store.get("tour:" + name, false))) return;
  endTour();
  tourState = { name, steps: TOURS[name], k: 0, el: null };
  window.addEventListener("resize", placeTour); window.addEventListener("scroll", placeTour, true);
  setTimeout(() => { if (tourState && tourState.name === name) showTourStep(); }, 350);
}
document.addEventListener("keydown", e => { if (tourState && e.key === "Escape") endTour(); });
$("#helpBtn").addEventListener("click", () => {
  const name = $(".card[data-i]") && !TEACH ? "lesson" : "list";
  if (name === "list" && location.hash) { location.hash = ""; setTimeout(() => startTour("list", true), 50); return; }
  startTour(name, true);
});

function route() {
  if (!DATA) return;
  endTour();
  if (TEACH) {
    setWho();
    const m = location.hash.match(/^#teach~([^~]+)~(.+)$/);
    const T = m && DATA.lessons.find(x => x.id === m[2]);
    if (T && DATA.students.some(s => s.id === m[1])) { window.scrollTo(0, 0); return viewTeacherLesson(m[1], T); }
    return viewTeacher();
  }
  if (!DATA.students.some(s => s.id === student)) { student = null; setWho(); return viewPick(); }
  setWho();
  const id = location.hash.slice(1);
  const L = DATA.lessons.find(x => x.id === id && x.for.includes(student));
  if (L) { viewLesson(L); window.scrollTo(0, 0); } else viewList();
}
window.addEventListener("hashchange", route);
fetch("data/lessons.json", { cache: "no-cache" }).then(r => r.json()).then(d => { DATA = d; prepGap(d); route(); })
  .catch(() => { $("#app").innerHTML = `<div class="notice"><b>Chưa tải được bài.</b> Kiểm tra mạng rồi tải lại trang.</div>`; });
</script>
