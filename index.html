<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpeakBack</title>
<meta name="description" content="Luyện shadowing tiếng Anh, chấm phát âm từng từ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow column (max 680px), phone-first; sticky top bar; each sentence is a practice card. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14213d; --muted:#5b6678; --line:#dde2ea;
  --accent:#1f4e79; --head:#1f4e79; --amber:#f2b705; --amber-ink:#14213d;
  --ok:#17834f; --ok-bg:#dff3e8; --near:#b45f06; --near-bg:#fdebd3; --bad:#c62839; --bad-bg:#fbe1e4; --miss:#8a94a6;
  --hl-y:#ffec78; --hl-g:#96f0aa; --hl-b:#82dcf0; --sep:#c87828; --other:#eef1f6;
  --f-ui:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --surface:#172133; --ink:#e8edf5; --muted:#9aa6b8; --line:#2a3750;
  --accent:#7fb2e5; --head:#1b2c47; --amber:#f2b705; --amber-ink:#14213d;
  --ok:#4cd38c; --ok-bg:#16382a; --near:#f0a14a; --near-bg:#3d2a12; --bad:#ff6b7a; --bad-bg:#43181f; --miss:#6f7b8f;
  --hl-y:#6b5c10; --hl-g:#1f5a32; --hl-b:#16566a; --sep:#e0a060; --other:#1b2638; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#172133; --ink:#e8edf5; --muted:#9aa6b8; --line:#2a3750;
  --accent:#7fb2e5; --head:#1b2c47; --amber:#f2b705; --amber-ink:#14213d;
  --ok:#4cd38c; --ok-bg:#16382a; --near:#f0a14a; --near-bg:#3d2a12; --bad:#ff6b7a; --bad-bg:#43181f; --miss:#6f7b8f;
  --hl-y:#6b5c10; --hl-g:#1f5a32; --hl-b:#16566a; --sep:#e0a060; --other:#1b2638; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
header.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.01em;flex:1;min-width:0}
header.top h1 small{display:block;font-weight:400;font-size:12px;opacity:.8}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.4);padding:6px 12px;min-height:36px;font-size:13px}
button.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
button.rec{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button[disabled]{opacity:.5;cursor:default}
main{padding-block:20px 48px;display:grid;gap:16px}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--near-bg);color:var(--ink);border:1px solid var(--line)}
.notice b{color:var(--near)}
h2{font-size:20px;margin:8px 0 0;text-wrap:balance}
.muted{color:var(--muted);font-size:14px}
/* student picker */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{min-height:96px;font-size:22px;font-weight:600}
/* homework groups + deadline */
.hw{display:grid;gap:10px}
.hw-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-bottom:2px solid var(--line);padding-bottom:6px}
.hw-head h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.hw-head h3 .dl{font-weight:400;color:var(--muted)}
.hw-note{font-size:14px;color:var(--muted);margin:0}
.due{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.due.soon{background:var(--near-bg);color:var(--near)}
.due.over{background:var(--bad-bg);color:var(--bad)}
.deadline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;border-radius:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--amber)}
.deadline .t{min-width:0;flex:1 1 220px}
.deadline .t b{display:block;font-weight:600}
.deadline .t span{font-size:14px;color:var(--muted)}
.deadline .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;text-align:right}
.deadline .big small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.deadline.soon{border-left-color:var(--near)} .deadline.soon .big{color:var(--near)}
.deadline.over{border-left-color:var(--bad)} .deadline.over .big{color:var(--bad)}
.role{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--hl-y);color:var(--ink);margin-left:4px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;font-weight:600;font-size:16px;background:var(--surface);border:1px solid var(--line)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.tcard h3{margin:0;font-size:16px}
.tscroll{overflow-x:auto}
.ttable{border-collapse:collapse;width:100%;font-size:14px}
.ttable th,.ttable td{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.ttable th{font-size:12px;color:var(--muted);font-weight:600;border-top:none}
.ttable td:not(:first-child),.ttable th:not(:first-child){text-align:center;width:22%}
.tpct{display:inline-block;min-width:52px;text-align:center;border-radius:999px;padding:3px 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.tpct.ok{background:var(--ok-bg);color:var(--ok)} .tpct.mid{background:var(--near-bg);color:var(--near)} .tpct.zero{background:var(--line);color:var(--muted)} .tpct.late{background:var(--bad-bg);color:var(--bad)}
.tlist{display:grid;gap:8px;padding:0 12px 12px}
.trow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;border-top:1px solid var(--line);border-radius:0;background:none;box-shadow:none;padding:10px 4px;min-height:0;font-weight:400}
.trow:hover{background:var(--other)}
.chev{font-size:22px;color:var(--muted);font-weight:700}
.trow .t{flex:1;min-width:0;display:grid;gap:2px}
.trow .t span{font-size:13px;color:var(--muted)}
.trow .weak{color:var(--near)!important}
details.cmp{border-top:1px dashed var(--line);padding-top:10px}
details.cmp summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent)}
details.cmp .up{color:var(--ok)} details.cmp .down{color:var(--bad)}
.take{display:grid;gap:4px;margin-top:10px}
.take-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px}
.take-h span{color:var(--muted)}
.playtake{min-height:34px;padding:4px 12px;font-size:13.5px}
.sent.small{font-size:16px;line-height:1.7}
.logincard{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.logincard p{margin:0;font-size:14.5px}
details.nolog summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
details.nolog .pick{margin-top:8px}
/* homework alert, Speaking/Listening tabs, session folders */
.alert{display:grid;gap:8px;background:var(--near-bg);border:1px solid var(--line);border-left:5px solid var(--near);border-radius:14px;padding:14px}
.alert h2{margin:0 0 2px;font-size:17px}
.alert-row{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px 12px;background:var(--surface)}
.alert-row .t{flex:1;min-width:0}
.alert-row .t b{display:block;font-weight:600;font-size:15px}
.alert-row .t span{font-size:13px;color:var(--muted)}
.alert-row.over{border-color:var(--bad)}
.allclear{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--ok-bg);color:var(--ok);font-weight:500}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.tab{border:none;background:transparent;font-weight:600;min-height:42px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;padding:0 6px;margin-left:4px}
.folder{display:grid;gap:10px}
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sess summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
details.sess summary::-webkit-details-marker{display:none}
details.sess summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.sess[open] summary::before{transform:rotate(90deg)}
.sname{font-weight:600;flex:1}
.smeta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
details.sess .lessons{padding:0 10px 10px}
.lesson .chips{display:block;margin-top:4px}
/* lesson list */
.lessons{display:grid;gap:10px}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-weight:600}
.lesson .t span{font-size:13px;color:var(--muted)}
.ring{--p:0;width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-variant-numeric:tabular-nums}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
details.video{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.video summary{padding:12px 14px;cursor:pointer;font-weight:500}
details.video video{display:block;width:100%;max-width:100%;border-radius:0 0 12px 12px;background:#000}
/* sentence card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.card .n{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.card .best{font-variant-numeric:tabular-nums}
.card.other{background:var(--other);padding:12px 16px;gap:8px}
.card.other .sent{font-size:16px;line-height:1.7;color:var(--muted)}
.card.other .actions button{flex:0 0 auto;min-height:38px;padding:6px 14px;font-size:14px}
.who{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--sep);text-transform:none}
.card.mine .who{color:var(--accent)}
.sent{font-size:20px;line-height:1.9;word-break:normal;overflow-wrap:anywhere}
.chunk{border-radius:6px;cursor:pointer;padding:2px 0}
.chunk:hover{background:color-mix(in srgb,var(--amber) 18%,transparent)}
.chunk.playing{background:color-mix(in srgb,var(--amber) 35%,transparent)}
.w{display:inline;border-radius:5px;padding:1px 2px}
.w.hy{background:var(--hl-y)}.w.hg{background:var(--hl-g)}.w.hb{background:var(--hl-b)}
.sepm{color:var(--sep);font-weight:600;margin:0 2px}
.w.ok{color:var(--ok);text-decoration:underline 3px var(--ok);text-underline-offset:5px}
.w.near{color:var(--near);text-decoration:underline 3px dashed var(--near);text-underline-offset:5px}
.w.bad{color:var(--bad);text-decoration:underline 3px wavy var(--bad);text-underline-offset:5px}
.w.miss{color:var(--miss);text-decoration:line-through 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1 1 auto}
.live{font-size:15px;color:var(--muted);min-height:1.5em}
.result{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-size:28px;font-variant-numeric:tabular-nums}
.heard{font-size:14px;color:var(--muted)}
.fixes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.fixes li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:14.5px;display:grid;gap:2px}
.fixes li.k-near{border-left-color:var(--near)}
.fixes li.k-miss{border-left-color:var(--miss)}
.fixes .word{font-weight:600;font-size:16px}
.ipa{font-family:var(--f-ipa);color:var(--accent);font-weight:500}
.fixes .tip{color:var(--muted)}
.tag{display:inline-block;justify-self:start;font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:2px 10px;margin-bottom:2px}
.dict{width:100%;font-family:inherit;font-size:17px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:72px}
.dict:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.hiddenSent{color:var(--muted);font-size:15px;font-style:italic}
.okmsg{font-size:14.5px;color:var(--ok)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding-top:8px}
.back{background:none;border:none;color:var(--accent);padding:0;min-height:0;font-weight:500;justify-self:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 30%,transparent)}}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,28,.55);display:grid;place-items:end center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;max-width:520px;width:100%;padding:22px 20px;display:grid;gap:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
@media (min-width:600px){.modal{place-items:center}}
.sheet h3{margin:0;font-size:19px}
.sheet p{margin:0;font-size:15px}
.sheet ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:15px}
.mic-ic{width:56px;height:56px;border-radius:50%;background:var(--amber);display:grid;place-items:center}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row button{flex:1 1 auto}

/* ===== Latte theme: warm coffee palette matching the cat stickers; airy cards, fewer hard borders ===== */
:root{
  --bg:#FBF5EC; --surface:#FFFDF9; --ink:#2B1E14; --muted:#7A6453; --line:#EEE3D4;
  --accent:#8A5A35; --head:#6B4428; --amber:#F2B43C; --amber-ink:#2B1E14;
  --ok:#2E7D4F; --ok-bg:#E3F3E8; --near:#B5650F; --near-bg:#FCEBD2; --bad:#C2413A; --bad-bg:#FBE3DF; --miss:#9A8B7D;
  --sep:#C2733A; --other:#F6EEE3; --soft:#F4E9DA; --shadow:0 2px 0 rgba(107,68,40,.06),0 8px 24px rgba(107,68,40,.07);
  --f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Baloo 2","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1511; --surface:#271E18; --ink:#F4EBDD; --muted:#BBA894; --line:#3A2E25;
  --accent:#E3B07E; --head:#2E2018; --amber:#F2B43C; --amber-ink:#2B1E14;
  --ok:#6FD39A; --ok-bg:#1D3527; --near:#F0A65A; --near-bg:#3B2914; --bad:#FF8A80; --bad-bg:#43201C; --miss:#8E7F72;
  --sep:#E0A060; --other:#211913; --soft:#30251D; --shadow:0 2px 0 rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1511; --surface:#271E18; --ink:#F4EBDD; --muted:#BBA894; --line:#3A2E25;
  --accent:#E3B07E; --head:#2E2018; --amber:#F2B43C; --amber-ink:#2B1E14;
  --ok:#6FD39A; --ok-bg:#1D3527; --near:#F0A65A; --near-bg:#3B2914; --bad:#FF8A80; --bad-bg:#43201C; --miss:#8E7F72;
  --sep:#E0A060; --other:#211913; --soft:#30251D; --shadow:0 2px 0 rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{font-size:16.5px;line-height:1.6}
main{padding-block:24px 64px;gap:22px}
h2{font-family:var(--f-disp);font-size:24px;line-height:1.25;font-weight:700;margin:4px 0 0}
h3{font-family:var(--f-disp)}
.muted{font-size:15px}
header.top{background:var(--head)}
header.top .wrap{padding-block:10px}
header.top h1{font-family:var(--f-disp);font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
header.top h1 .logo{width:40px;height:40px;flex:none}
header.top h1 small{font-family:var(--f-ui);font-size:12.5px;font-weight:600;opacity:.85}
button{border-radius:999px;border:1.5px solid var(--line);font-weight:700;padding:10px 18px}
button.primary{box-shadow:0 3px 0 #C98A1C}
button.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #C98A1C}
button.ghost{border-color:rgba(255,255,255,.45);font-weight:700}
.notice{border:none;border-radius:16px;padding:14px 16px}
.card,.lesson,details.sess,details.video,.tcard,.logincard,.deadline,.alert-row{border:none;box-shadow:var(--shadow)}
.card{border-radius:22px;padding:20px;gap:14px}
.card.other{box-shadow:none;background:var(--other)}
.lesson{border-radius:18px;padding:14px 16px;background:var(--surface)}
.ring{width:52px;height:52px}
.ring i{width:42px;height:42px;font-size:13px}
.lessons{gap:12px}
.pick button{border-radius:22px;min-height:120px;font-family:var(--f-disp);font-size:26px;box-shadow:var(--shadow);border:none;display:grid;place-items:center;gap:4px}
.pick button span{font-size:30px;line-height:1}
.tabs{background:var(--soft);border-radius:999px;padding:5px}
.tab{border-radius:999px;font-size:16px}
.tab.on{box-shadow:var(--shadow)}
details.sess{border-radius:20px}
details.sess summary{padding:14px 18px}
.sname{font-family:var(--f-disp);font-size:19px}
details.sess .lessons{padding:0 12px 14px}
details.sess .lesson{box-shadow:none;background:var(--other)}
.alert{border:none;border-radius:22px;padding:18px;position:relative;background:var(--near-bg);gap:10px}
.alert h2{font-size:20px;padding-right:96px}
.alert{margin-top:18px}
.alert .sticker{position:absolute;right:12px;top:-40px;width:78px;transform:rotate(6deg)}
.alert-row{border-radius:16px}
.allclear{display:flex;align-items:center;gap:14px;border-radius:22px;padding:14px 18px;font-size:16px}
.allclear img{width:84px;flex:none}
.deadline{border-left:none;border-radius:20px;background:var(--soft)}
.deadline.soon{background:var(--near-bg)} .deadline.over{background:var(--bad-bg)}
.deadline .big{font-family:var(--f-disp);font-size:34px}
.due{font-weight:800}
.sent{font-size:21px}
.result{border-top:2px dashed var(--line);padding-top:14px}
.cheer{display:flex;align-items:center;gap:12px}

<body>
<header class="top"><div class="wrap">
  <h1><img class="logo" src="stickers/cup-cat.svg" alt=""><span>SpeakBack<small id="who"></small></span></h1>
  <button class="ghost" id="switchBtn" hidden>Đổi tên</button>
</div></header>
<main class="wrap" id="app"><p class="muted">Đang tải bài…</p></main>
<audio id="player" preload="auto" playsinline></audio>
<div class="modal" id="micModal" hidden role="dialog" aria-modal="true" aria-labelledby="micTitle"><div class="sheet" id="micSheet"></div></div>

<script type="module" src="cloud.js"></script>
<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";
env.allowLocalModels = false;
let asrP = null;
window.Whisper = {
  load(onProgress) {
    if (!asrP) asrP = pipeline("automatic-speech-recognition", "Xenova/whisper-tiny.en",
      { dtype: "q8", device: "wasm", progress_callback: p => onProgress && onProgress(p) })
      .catch(e => { asrP = null; throw e; });
    return asrP;
  },
  async transcribe(f32) { const asr = await this.load(); const out = await asr(f32); return (out && out.text || "").trim(); }
};
window.dispatchEvent(new Event("whisper-ready"));
</script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("shl:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("shl:" + k, JSON.stringify(v)); } catch {} }
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const inZalo = /Zalo/i.test(navigator.userAgent);
let DATA = null, student = store.get("student", null);
const player = $("#player");
let stopAt = null, playingEl = null;

/* ---------- homework + deadline ---------- */
const WD = ["Sun", "Mon", "Tues", "Wed", "Thurs", "Fri", "Sat"];
const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function parseDay(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtDeadline(iso) { const d = parseDay(iso); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}`; }
function daysLeft(iso) {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((parseDay(iso) - today) / 86400000);
}
function dueInfo(iso) {
  const n = daysLeft(iso);
  if (n > 1) return { cls: n <= 2 ? "soon" : "", chip: `Còn ${n} ngày`, big: String(n), sub: "ngày còn lại" };
  if (n === 1) return { cls: "soon", chip: "Còn 1 ngày", big: "1", sub: "ngày còn lại · hạn là ngày mai" };
  if (n === 0) return { cls: "soon", chip: "Hạn nộp hôm nay", big: "0", sub: "hôm nay là hạn nộp" };
  return { cls: "over", chip: `Quá hạn ${-n} ngày`, big: String(-n), sub: "ngày quá hạn" };
}
function hwTitle(H) { return `${H.title} – Deadline ${fmtDeadline(H.deadline)}`; }
function homeworkOf(L) { return (DATA.homework || []).find(H => H.lessons.includes(L.id)); }
function myRole(L) { return L.roles ? L.roles[student] || null : null; }
function isMine(L, s) { const r = myRole(L); return !r || !s.speaker || s.speaker === r; }
function deadlineBox(L) {
  const H = homeworkOf(L);
  if (!H) return "";
  const d = dueInfo(H.deadline);
  return `<div class="deadline ${d.cls}" role="status">
    <div class="t"><b>⏰ ${esc(hwTitle(H))}</b><span>${esc(H.note || "")}</span></div>
    <div class="big">${esc(d.big)}<small>${esc(d.sub)}</small></div></div>`;
}

/* ---------- text helpers ---------- */
const NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","12":"twelve"};
function normWord(w) {
  w = w.toLowerCase().replace(/[’`]/g, "'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
  return NUM[w] || w;
}
function speechWord(raw) { // remove stress marks but keep contractions
  return raw.replace(/([A-Za-z])'(?=(m|s|t|re|ll|ve|d)\b)/g, "$1\u0000").replace(/'/g, "").replace(/\u0000/g, "'");
}
/* parse a marked sentence into chunks of display words */
function parseSentence(text) {
  const chunks = [];
  const parts = text.split("/").map(s => s.trim()).filter(s => s.length);
  let hl = null;
  for (const part of parts) {
    const words = [];
    for (const tok of part.split(/(==|\+\+|!!|\*\*)/)) {
      if (tok === "==" || tok === "++" || tok === "!!") { const k = {"==":"y","++":"g","!!":"b"}[tok]; hl = hl === k ? null : k; continue; }
      if (tok === "**" || !tok) continue;
      for (const raw of tok.split(/\s+/).filter(Boolean)) {
        if (raw === "‿") { if (words.length) words[words.length - 1].link = true; continue; }
        if (/^[.,!?;:]+$/.test(raw) && words.length) { words[words.length - 1].raw += raw; continue; }
        /* hyphenated words (forty-two, B-R-Y-A-N-T, binge-watch) are graded part by part, shown joined by "-" */
        const pieces = raw.replace(/\.{3}/g, "").split(/(?<=[A-Za-z])-(?=[A-Za-z])/);
        pieces.forEach((pc, pi) => words.push({ raw: pc + (pi < pieces.length - 1 ? "-" : ""), hl, key: normWord(speechWord(pc)), joinNext: pi < pieces.length - 1 }));
      }
    }
    chunks.push(words);
  }
  return chunks;
}

/* ---------- alignment ---------- */
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function sim(a, b) { return a === b ? 1 : 1 - lev(a, b) / Math.max(a.length, b.length, 1); }
/* expand recognizer output to words comparable with the expected keys */
/* numbers the recognizer (or the student) writes as digits, spelled out the way the sentence says them */
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function cardinal(n) {
  if (n < 20) return [ONES[n]];
  if (n < 100) return n % 10 ? [TENS[Math.floor(n / 10)], ONES[n % 10]] : [TENS[n / 10]];
  if (n < 1000) return [ONES[Math.floor(n / 100)], "hundred", ...(n % 100 ? cardinal(n % 100) : [])];
  return null;
}
let EXPECT = new Set();
function spellNumber(d) {
  const digits = [...d].map(c => ONES[+c]);
  const ohs = [...d].map(c => c === "0" ? "oh" : ONES[+c]);
  const card = d.length <= 3 && d[0] !== "0" ? cardinal(+d) : null;
  const score = ws => ws.filter(w => EXPECT.has(w)).length;
  return [card, ohs, digits].filter(Boolean).sort((a, b) => score(b) - score(a))[0];
}
function heardWords(transcript) {
  return transcript.replace(/(\d+):(\d\d)/g, "$1 $2").replace(/-/g, " ").replace(/\$/g, "").split(/\s+/)
    .flatMap(w => { const d = w.replace(/[^0-9]/g, ""); return d && d === w.replace(/[.,!?;:]/g, "") ? spellNumber(d) : [w]; })
    .map(normWord).filter(Boolean);
}
function align(exp, got) { // returns per-expected index: {heard|null}
  const m = exp.length, n = got.length, INF = 1e9;
  const D = Array.from({length: m + 1}, () => Array(n + 1).fill(INF)), B = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
  D[0][0] = 0;
  for (let i = 0; i <= m; i++) for (let j = 0; j <= n; j++) {
    if (i < m && D[i][j] + 1 < D[i+1][j]) { D[i+1][j] = D[i][j] + 1; B[i+1][j] = 1; }          // expected word missing
    if (j < n && D[i][j] + 1 < D[i][j+1]) { D[i][j+1] = D[i][j] + 1; B[i][j+1] = 2; }          // extra heard word
    if (i < m && j < n) { const c = D[i][j] + (1 - sim(exp[i], got[j])) * 1.6; if (c < D[i+1][j+1]) { D[i+1][j+1] = c; B[i+1][j+1] = 3; } }
  }
  const out = Array(m).fill(null); let i = m, j = n;
  while (i > 0 || j > 0) {
    const b = B[i][j];
    if (b === 3) { out[i-1] = got[j-1]; i--; j--; }
    else if (b === 1) { out[i-1] = null; i--; }
    else { j--; }
  }
  return out;
}

/* ---------- pattern feedback (same patterns as the teacher's feedback) ---------- */
const VOWELS = /[aeiouy]/;
const FUNC = new Set(["a","an","the","of","to","in","on","at","and","my","i","it","is","are","for","with","so","but","from","about","as","that","there's","it's","i'm"]);
function diagnose(exp, heard) {
  if (!heard) return FUNC.has(exp) ? `Em bỏ sót từ nhỏ “${exp}”. Từ nhỏ vẫn đọc, chỉ đọc lướt nhẹ.` : `Em bỏ sót “${exp}”.`;
  if (exp.endsWith("ing") && !heard.endsWith("ing") && exp.startsWith(heard.slice(0, 3))) return "Thiếu đuôi -ing.";
  if (/(es|s)$/.test(exp) && (heard === exp.slice(0, -1) || heard === exp.slice(0, -2))) return "Thiếu âm cuối /s/ hoặc /z/ của đuôi -s/-es.";
  if (exp.startsWith(heard) && heard.length >= 2 && !VOWELS.test(exp.slice(heard.length))) return `Mất âm cuối (${exp.slice(heard.length)}).`;
  const stem = s => s.replace(/[^aeiouy]+$/, "");
  if (stem(exp) && stem(exp) === stem(heard)) return `Âm cuối chưa đúng: máy nghe thành “${heard}”.`;
  if (exp.slice(1) === heard.slice(1) || exp.slice(2) === heard.slice(2) || (exp.length > 3 && exp.slice(-3) === heard.slice(-3) && exp[0] !== heard[0]))
    return `Âm đầu chưa đúng: máy nghe thành “${heard}”.`;
  if (exp[0] === heard[0] && exp.slice(-1) === heard.slice(-1)) return `Nguyên âm chưa đúng: máy nghe thành “${heard}”.`;
  return `Máy nghe thành “${heard}”.`;
}

/* ---------- cloud: Google sign-in + progress saved online (cloud.js) ---------- */
const cloudOn = () => !!(window.Cloud && window.Cloud.enabled);
const cloudUser = () => cloudOn() ? window.Cloud.user : null;
function syncBest(lessonId, best) { if (cloudUser()) window.Cloud.saveBest(lessonId, best); }
function studentForEmail(email) {
  email = (email || "").toLowerCase();
  const s = DATA.students.find(x => (x.emails || []).some(e => e.toLowerCase() === email));
  return s ? s.id : null;
}
/* keep the higher score per sentence from this device and from the account, then save both */
function mergeBest(cloudBest) {
  const out = {};
  for (const L of DATA.lessons) {
    if (!L.for.includes(student)) continue;
    const key = `best:${student}:${L.id}`, local = store.get(key, {}), remote = (cloudBest || {})[L.id] || {};
    const m = { ...remote };
    for (const [i, v] of Object.entries(local)) if (m[i] == null || v > m[i]) m[i] = v;
    if (Object.keys(m).length) { store.set(key, m); if (JSON.stringify(m) !== JSON.stringify(remote)) out[L.id] = m; }
  }
  return out;
}
let cloudNote = "";
let TEACH = null;   // null = not a teacher; [] or rows = teacher view data
async function checkTeacher(user) {
  try { TEACH = await window.Cloud.listUsers(); return true; }
  catch (e) { TEACH = null; return false; }
}
async function onCloud(user, profile) {
  if (!DATA) return;
  cloudNote = "";
  TEACH = null;
  if (user && await checkTeacher(user)) { route(); return; }
  if (user && profile && profile._error) {
    cloudNote = profile._error.includes("permission") ? `Gmail ${user.email} chưa được cô cho vào lớp. Em đăng xuất rồi đăng nhập bằng Gmail đã gửi cho cô nha.` : "Chưa tải được tiến độ trên mạng. Kiểm tra mạng rồi tải lại trang.";
  } else if (user && profile) {
    const id = profile.student || studentForEmail(user.email);
    if (id && DATA.students.some(s => s.id === id)) {
      student = id; store.set("student", student);
      const changed = mergeBest(profile.best);
      const patch = {};
      if (profile.student !== id) patch.student = id;
      if (Object.keys(changed).length) patch.best = changed;
      if (Object.keys(patch).length) window.Cloud.save(patch).catch(e => console.error(e));
    } else { student = null; }
  }
  route();
}
window.addEventListener("cloud-ready", () => { if (cloudOn()) window.Cloud.onChange(onCloud); });

/* ---------- views ---------- */
function setWho() {
  const s = DATA.students.find(x => x.id === student), u = cloudUser();
  if (TEACH && u) { $("#who").textContent = "Giáo viên · " + u.email; $("#switchBtn").hidden = false; $("#switchBtn").textContent = "Đăng xuất"; return; }
  $("#who").textContent = s ? "Học viên: " + s.name + (u ? " · đã lưu online" : "") : (u ? u.email : "");
  $("#switchBtn").hidden = !s && !u;
  $("#switchBtn").textContent = u ? "Đăng xuất" : "Đổi tên";
}
$("#switchBtn").addEventListener("click", async () => {
  if (cloudUser()) { await window.Cloud.flush(); await window.Cloud.signOut(); }
  TEACH = null;
  student = null; store.set("student", null); location.hash = ""; route();
});

function lessonProgress(L) {
  const best = store.get(`best:${student}:${L.id}`, {});
  const mine = L.sentences.map((s, i) => [s, i]).filter(([s]) => isMine(L, s));
  const done = mine.filter(([, i]) => (best[i] || 0) >= 80).length;
  return mine.length ? Math.round(done / mine.length * 100) : 0;
}

function banner() {
  if (inZalo) return `<div class="notice"><b>Đang mở trong Zalo.</b> Zalo không cho dùng micro. Bấm dấu ⋯ góc trên, chọn <b>Mở bằng trình duyệt</b> (Chrome hoặc Safari).</div>`;
  if (useWhisper()) return `<div class="notice" id="engineNote"><b>Bộ chấm giọng</b> <span id="engineStatus">chưa tải. Lần đầu bấm nói, máy tải khoảng 40MB (nên dùng wifi). Những lần sau mở là dùng được ngay.</span></div>`;
  return "";
}

const GOOGLE_SVG = `<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>`;
function wireSignIn() {
  const g = $("#gSignIn");
  if (g) g.addEventListener("click", async () => {
    g.disabled = true;
    try { await window.Cloud.signIn(); }
    catch (e) { const el = $("#gErr"); el.hidden = false; el.textContent = "Chưa đăng nhập được (" + (e.code || e.message) + "). Mở web bằng Chrome hoặc Safari rồi thử lại."; }
    finally { g.disabled = false; }
  });
}
function viewPick() {
  const u = cloudUser(), google = GOOGLE_SVG;
  $("#app").innerHTML = `${cloudNote ? `<div class="notice"><b>Lưu ý.</b> ${esc(cloudNote)}</div>` : ""}
    ${cloudOn() && !u ? `
    <div class="pickhero"><img src="stickers/wink.svg" alt=""><h2>Chào em! 👋 Đăng nhập để lưu tiến độ nha</h2></div>
    <p class="muted">Đăng nhập bằng Gmail thì em mở máy nào cũng thấy mình đã luyện câu nào, xong homework nào.</p>
    <button class="gbtn" id="gSignIn">${google}<span>Đăng nhập bằng Google</span></button>
    <p class="muted" id="gErr" hidden></p>
    <details class="nolog"><summary>Dùng không đăng nhập (chỉ lưu trên máy này)</summary>
      <div class="pick">${DATA.students.map(s => `<button data-id="${s.id}">${esc(s.name)}</button>`).join("")}</div></details>` : `
    <div class="pickhero"><img src="stickers/wink.svg" alt=""><h2>${u ? `Chào ${esc(u.displayName || u.email)}! 👋 Em là ai?` : "Chào em! 👋 Em là ai?"}</h2></div>
    <p class="muted">${u ? "Chọn tên 1 lần, lần sau đăng nhập web tự nhận ra em." : "Chọn tên để xem bài luyện của em. Kết quả luyện lưu trên máy này."}</p>
    <div class="pick">${DATA.students.map((s, k) => `<button data-id="${s.id}"><span>${["🐱", "🐯", "🦊", "🐼"][k % 4]}</span>${esc(s.name)}</button>`).join("")}</div>`}`;
  wireSignIn();
  $("#app").querySelectorAll(".pick button").forEach(b => b.addEventListener("click", () => {
    student = b.dataset.id; store.set("student", student); location.hash = "";
    if (cloudUser()) { const changed = mergeBest((window.Cloud.profile || {}).best); window.Cloud.save({ student, best: changed }).catch(e => console.error(e)); }
    route();
  }));
}

function skillOf(L) {
  if (L.skill) return L.skill;
  const H = homeworkOf(L);
  if (H && H.skill) return H.skill;
  return L.type === "dictation" ? "Listening" : "Speaking";
}
function lessonButton(L) {
  const p = lessonProgress(L), r = myRole(L), H = homeworkOf(L);
  const n = L.sentences.filter(s => isMine(L, s)).length;
  const hwChip = H ? (() => { const d = dueInfo(H.deadline); return `<span class="due ${p >= 100 ? "" : d.cls}">${p >= 100 ? "✅ Đã xong" : "📝 Homework · " + esc(d.chip)}</span>`; })() : "";
  return `<button class="lesson" data-id="${L.id}"><span class="ring" style="--p:${p}"><i>${p}%</i></span>
    <span class="t"><b>${esc(L.title)}${r ? `<span class="role">Em nói phần ${esc(r)}</span>` : ""}</b><span>${L.type === "dictation" ? "Nghe chép" : "Shadowing"} · ${n} câu</span>${hwChip ? `<span class="chips">${hwChip}</span>` : ""}</span></button>`;
}
/* homework still to do: not finished, deadline not passed more than 7 days ago */
function pendingHomework(mine) {
  const today = daysLeft;
  return (DATA.homework || []).map(H => {
    const ls = mine.filter(L => H.lessons.includes(L.id));
    const p = ls.length ? Math.round(ls.reduce((a, L) => a + lessonProgress(L), 0) / ls.length) : 0;
    return { H, ls, p, n: today(H.deadline) };
  }).filter(x => x.ls.length && x.p < 100 && x.n >= -7).sort((a, b) => a.n - b.n);
}
function viewList() {
  const mine = DATA.lessons.filter(L => L.for.includes(student));
  const todo = pendingHomework(mine);
  const tab = ["Speaking", "Listening"].includes(store.get("tab", "")) ? store.get("tab", "") : "Speaking";
  const open = store.get("openSessions", {});
  const folder = skill => {
    const ls = mine.filter(L => skillOf(L) === skill);
    const sessions = [...new Set(ls.map(L => L.session))].sort((a, b) => b - a);
    if (!sessions.length) return `<p class="muted">Chưa có bài ${skill} nào.</p>`;
    return sessions.map((n, k) => {
      const inS = ls.filter(L => L.session === n).sort((a, b) => (homeworkOf(b) ? 1 : 0) - (homeworkOf(a) ? 1 : 0));
      const dueHere = todo.filter(x => x.ls.some(L => inS.includes(L)));
      const key = skill + n, isOpen = open[key] != null ? open[key] : (k === 0 || dueHere.length > 0);
      return `<details class="sess" data-key="${key}" ${isOpen ? "open" : ""}>
        <summary><span class="sname">📚 Buổi ${n}</span><span class="smeta">${inS.length} bài${dueHere.length ? ` · <span class="due ${dueInfo(dueHere[0].H.deadline).cls}">Có homework</span>` : ""}</span></summary>
        <div class="lessons">${inS.map(lessonButton).join("")}</div></details>`;
    }).join("");

    <p class="muted" id="tLoading">Đang tải các lần nói…</p>
    ${p.idx.map((i, k) => `<section class="card" data-i="${i}">
      <div class="n"><span>Câu ${k + 1}/${p.idx.length}${L.sentences[i].label ? " · " + esc(L.sentences[i].label) : ""}</span><span class="best">${best[i] != null ? "Tốt nhất: " + best[i] + "%" : "Chưa thử"}</span></div>
      <div class="sent small">${renderSentenceHTML(parseSentence(L.sentences[i].text))}</div>
      <div class="actions"><button class="listen">Nghe mẫu</button></div>
      <details class="cmp" hidden></details></section>`).join("")}`;
  $("#backBtn").addEventListener("click", () => { teachOpen = sid; location.hash = ""; });
  player.src = L.video;
  $("#app").querySelectorAll(".card").forEach(c => { const S2 = L.sentences[+c.dataset.i]; c.querySelector(".listen").addEventListener("click", e => playSpan(S2.start, S2.end, e.currentTarget)); });
  /* takes from every account of this student: earliest "first", latest "last" */
  const takes = {};
  try {
    for (const u of docs) for (const r of await window.Cloud.loadTakesOf(u.uid, L.id)) {
      const cur = takes[r.i] || (takes[r.i] = {}), t = { s: r.s, h: r.h, st: r.st, at: r.at, audio: r.audio };
      if (r.kind === "first" ? (!cur.first || t.at < cur.first.at) : (!cur.last || t.at > cur.last.at)) cur[r.kind] = t;
    }
  } catch (e) { console.error(e); }
  if (location.hash !== `#teach~${sid}~${L.id}`) return;
  const ld = $("#tLoading");
  if (ld) ld.textContent = Object.keys(takes).length ? "" : "Chưa có lần nói nào được lưu (học sinh cần đăng nhập Gmail lúc luyện).";
  $("#app").querySelectorAll(".card[data-i]").forEach(c => {
    const i = +c.dataset.i, cur = takes[i];
    if (!cur) return;
    const first = cur.first || cur.last, last = cur.last || cur.first;
    CLIPS[L.id + ":" + i] = { first: first.audio, last: last.audio };
    renderCompare(L, i, c, { first, last }, "Nghe ghi âm");
    c.querySelector(".cmp").open = true;
  });
}

function route() {
  if (!DATA) return;
  if (TEACH) {
    setWho();
    const m = location.hash.match(/^#teach~([^~]+)~(.+)$/);
    const T = m && DATA.lessons.find(x => x.id === m[2]);
    if (T && DATA.students.some(s => s.id === m[1])) { window.scrollTo(0, 0); return viewTeacherLesson(m[1], T); }
    return viewTeacher();
  }
  if (!DATA.students.some(s => s.id === student)) { student = null; setWho(); return viewPick(); }
  setWho();
  const id = location.hash.slice(1);
  const L = DATA.lessons.find(x => x.id === id && x.for.includes(student));
  if (L) { viewLesson(L); window.scrollTo(0, 0); } else viewList();
}
window.addEventListener("hashchange", route);
fetch("data/lessons.json", { cache: "no-cache" }).then(r => r.json()).then(d => { DATA = d; route(); })
  .catch(() => { $("#app").innerHTML = `<div class="notice"><b>Chưa tải được bài.</b> Kiểm tra mạng rồi tải lại trang.</div>`; });
</script>
</body>
</html>
